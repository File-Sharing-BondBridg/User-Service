spring.application.name=user-service

server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres.file-sharing.svc.cluster.local:5432/usermanager
spring.datasource.username=fileuser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://keycloak.bondbridg.com/realms/bondbridg}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWT_URI:https://keycloak.bondbridg.com/realms/bondbridg/protocol/openid-connect/certs}
keycloak.admin-base-url=${KEYCLOAK_ADMIN_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:bondbridg}
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8081/realms/bondbridg/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:user-service}
keycloak.client-secret=${KEYCLOAK_USER_SERVICE_SECRET}

# logging
logging.level.web=DEBUG
logging.level.sql=DEBUG
logging.level.org.springframework.web.cors=TRACE
logging.level.org.springframework.security=DEBUG


# NATS
nats.servers=${NATS_SERVERS:nats://nats:4222}